[project]
name = "varnam-agent"
version = "0.1.0"
description = "RAG pipeline on Databricks (medallion architecture) exposed as an MCP retrieval tool."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "databricks-sdk>=0.40.0",
    "databricks-vectorsearch>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
varnam-agent-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*", "rag_common*"]
